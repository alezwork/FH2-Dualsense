; DualSense.dll -- controllers for Forza Horizon 2: the PlayStation 5 controller (DualSense / DualSense Edge), the
; Xbox controller's impulse triggers, the keyboard. Read when the game starts.
; The DualSense over USB or Bluetooth. Close Steam's PlayStation controller support and DS4Windows while playing, or
; both will drive the controller's lights and vibration.

[DualSense]
; the DualSense on (1) or off (0); the Xbox controller and the keyboard work either way
Enabled=1
; 1 = Circle confirms and Cross goes back (the Japanese layout)
SwapCrossCircle=0
; what the touchpad click and the Create button are for the game (A, B, X, Y, LB, RB, LS, RS, Menu, View,
; DPadUp, DPadDown, DPadLeft, DPadRight, or empty); Options is always Menu
TouchpadClick=View
CreateButton=View
; swipe on the touchpad = a D-pad press in that direction
TouchpadSwipes=1
; PS button: Battery = the player lights show the charge for 3 seconds (1-5 lights); None = nothing
PSButton=Battery
; DualSense Edge: back paddles and Fn buttons (same names as above; empty = nothing)
EdgeLeftPaddle=X
EdgeRightPaddle=B
EdgeLeftFn=
EdgeRightFn=

[Vibration]
; the game's rumble (engine revs, collisions, tyres):
;   Auto   = HD haptics over USB (our waveforms on the controller's haptic actuators), rumble emulation over Bluetooth
;   Audio  = HD haptics only (USB)
;   Rumble = the controller's rumble emulation (USB and Bluetooth)
;   Off
Mode=Auto
; strength in percent (up to 200)
Strength=100
; HD haptics: the tones of the heavy (left) and the light (right) motor, in Hz
HapticsLowHz=45
HapticsHighHz=160
; the car itself, from the game's own data: the engine as a hum at its revs (louder towards the redline and with
; the throttle), knocking on the rev limiter, a knock at each gear change, the road's roughness (HD haptics; over
; Bluetooth the gear changes and the rev limiter only); percent, 0 = off
Car=40
; the game's own rumble on crashes, in percent. The game shakes the pad at full for any touch of a fence or a bush;
; here it grows with the impact instead (a scrape: light, a pole or a wall at speed: full). 0 = no crash rumble
Collisions=60

[Triggers]
; trigger feedback on (1) or off (0): the DualSense's adaptive triggers and the Xbox controller's impulse triggers
; ([ImpulseTriggers]); the game's controller settings have the same switch ("Trigger feedback")
Enabled=1
; what they do:
;   Game           = they follow the car (from the game's own data on the tyres and the engine):
;                    L2 chatters when the front tyres go past their grip limit under braking (ABS at work) and
;                    judders harder and faster as the wheels lock; R2 vibrates with wheel spin and knocks on the rev
;                    limiter; a gear change knocks on the trigger you press; a crash jolts both, by how hard it was
;                    (a scrape lightly); the resistance below the rest of the time
;   ResistanceOnly = only the resistance
;   Off
Mode=Game
; strength in percent
Strength=100
; L2: Slope = a brake pedal (light at first, harder at the end), Constant, Off
BrakeResistance=Slope
; where it starts (0 = at once .. 8) and its force at the start and at the end (1..8)
BrakeStart=1
BrakeForceStart=1
BrakeForceEnd=6
; R2: Constant, Slope, Off; start (0..9) and force (1..8)
ThrottleResistance=Constant
ThrottleStart=1
ThrottleForce=1
; how fast the triggers vibrate, in Hz
BrakeVibrationHz=30
ThrottleVibrationHz=40
; where the brake trigger starts to chatter: the front tyres' slip in percent of their grip limit (100 = at it,
; lower = a warning before it; it is full at 300, the wheels locked; the game's own Xbox One triggers: 150)
BrakeSlipStart=120
; where the throttle trigger starts with wheel spin (full at 250; the game's own: 70)
SpinSlipStart=80
; a knock on gear changes, knocking on the rev limiter, a jolt on crashes (1 on, 0 off; for the Xbox pad too)
GearChangeKick=1
RevLimiter=1
CrashJolt=1
; in the menus, with the game paused, loading: the triggers free (0 = the resistance stays)
FreeInMenus=1

[ImpulseTriggers]
; the Xbox controller's impulse triggers: the small rumble motors in LT and RT (Xbox One and Series controllers, over
; USB or the Xbox Wireless Adapter; over Bluetooth where Windows passes them on). Like the DualSense's triggers, from
; the car: LT pulses like ABS at the front tyres' grip limit under braking and buzzes as the wheels lock; RT buzzes
; with wheel spin and knocks on the rev limiter; gear changes and crashes kick (the switches and thresholds in
; [Triggers] count for both). "Trigger feedback" in the game's controller settings switches them on and off.
; 1 = on (the Xbox pad's rumble then goes through Windows.Gaming.Input), 0 = off (plain XInput rumble)
Enabled=1
; strength in percent
Strength=100

[Lightbar]
; Rumble = the colour, flashing towards FlashColor with the vibration (impacts, tyres sliding)
; Revs   = the colour while cruising, turning red towards the redline, flashing on the rev limiter
; Static = the colour; Battery = green (full) to red (empty); Off
Mode=Rumble
Color=255, 70, 0
FlashColor=255, 255, 255
; percent
Brightness=100
; blink red when the battery is at 15% or less and not charging
LowBatteryBlink=1
; the five player lights as a rev counter while driving: from 70% of the redline, all five at it, flashing on the
; limiter (0 = player 1)
RevLights=1

[Icons]
; the game's button icons follow the device you used last: the DualSense (PlayStation icons), an Xbox pad (the game's
; own), the keyboard (its keys, from [Keys] below). The controls screen drawing too.
;   Auto = like that;  On = always PlayStation;  Off = always the game's own
; The PlayStation icons are inside DualSense.dll. Your own: put a DualSense.icons (a zip of PNG pictures, the same
; names and sizes) next to it -- it is taken instead.
PlayStation=Auto

[Camera]
; the cockpit camera alive: the head looks into turns, leans and sways with the sideways g-forces, dips forward under
; braking and sinks back under throttle, rides the bumps and shakes a little at speed (the game's own camera physics,
; retuned). 1 on, 0 = the game's own camera
Dynamic=1
; looking into turns: degrees at 1 g sideways (if it looks out of the turns instead, make it negative)
LookIntoTurns=8
; leaning: the horizon tilting and the head pushed to the outside in turns, percent
Lean=100
; braking and throttle: how much deeper than the game's own the dip and the push back are, percent (0 = the game's)
Pitch=100
; the bumps and kerbs, percent of the game's own
Bumps=150
; a light shake growing with speed, percent (0 = none)
Shake=60

[Gyro]
; steering by tilting the controller like a wheel:
;   Toggle = the mic button switches it on and off (the mic light is on while it is on; the position when you
;            switch it on is the centre)
;   On     = always (the centre: how you hold it when the controller connects)
;   Off    = the mic button does nothing
Steering=Toggle
; tilt for full lock, in degrees
MaxAngle=40
; 1 = steer the other way
Invert=0

[Keyboard]
; the keyboard as the game's gamepad (together with any real gamepad and the DualSense): 1 on, 0 off
Enabled=1
; keys count only while the game window is in front (0 = always)
OnlyWhenGameInFront=1
; how fast the steering moves: stick travel per second (1.0 = from the centre to full lock in one second)
SteerSpeed=3.0
; how fast it comes back to the centre when you let go (or steer the other way)
SteerReturn=5.0
; throttle and brake: how fast they press in and let off (0 = at once, like a button)
PedalSpeed=8.0
; looking around (right stick): 0 = at once
LookSpeed=0

[Keys]
; Names: a letter or digit, F1..F24, Space, Enter, Backspace, Tab, Escape, LShift, RShift, LCtrl, RCtrl, LAlt, RAlt,
; Up, Down, Left, Right, Home, End, PageUp, PageDown, Insert, Delete, CapsLock, Numpad0..Numpad9, NumpadPlus,
; NumpadMinus, NumpadStar, NumpadSlash, NumpadDot, Comma, Period, Minus, Equals, Semicolon, Slash, Backquote,
; LBracket, RBracket, Backslash, Quote, Mouse1..Mouse5. Up to 4 keys per control, separated by commas; empty = none.
Throttle=W
Brake=S
SteerLeft=A
SteerRight=D
; left stick up/down (menus also move with the D-pad, below)
StickUp=
StickDown=
; right stick: look around
LookLeft=J
LookRight=L
LookUp=I
LookDown=K
A=Space, Enter
B=E, Backspace
X=Q
Y=R
LB=LShift
RB=C
LeftStickClick=F
RightStickClick=V
Menu=Escape
View=Tab
DPadUp=Up
DPadDown=Down
DPadLeft=Left
DPadRight=Right
