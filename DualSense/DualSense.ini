; d3d12.dll (next to azimuth.exe) -- the PlayStation 5 controller (DualSense / DualSense Edge) for Forza Horizon 2 on
; Azimuth 0.9.10, on top of Forza Horizon 2 Extra Options (winmm.dll next to azimuth.exe) -- without it the mod is off.
; Read when Azimuth starts; the main settings are also in the game's own menu (Settings > Controls, below the game's
; rows), and what you change there is written here. The menu and the PlayStation icons reach the game through Extra
; Options' media overrides (FH2_ExtraOptions.ini: [Files] EnableMediaOverrides=1).
; The DualSense over USB or Bluetooth. Close Steam's PlayStation controller support and DS4Windows while playing, or
; both will drive the controller's lights and vibration.

[DualSense]
; the mod on (1) or off (0): off = no controller, no hooks into the game, and its files taken out of Extra Options'
; mediaoverride folder (the game's own menu and icons again; they are listed in mediaoverride.txt in this folder)
Enabled=1
; 1 = Circle confirms and Cross goes back (the Japanese layout)
SwapCrossCircle=0
; what the touchpad click and the Create button are for the game (A, B, X, Y, LB, RB, LS, RS, Menu, View,
; DPadUp, DPadDown, DPadLeft, DPadRight, or empty); Options is always Menu
TouchpadClick=View
CreateButton=View
; swipe on the touchpad = a D-pad press in that direction
TouchpadSwipes=1
; PS button: Battery = the player lights show the charge for 3 seconds (1-5 lights); None = nothing
PSButton=Battery
; DualSense Edge: back paddles and Fn buttons (same names as above; empty = nothing)
EdgeLeftPaddle=X
EdgeRightPaddle=B
EdgeLeftFn=
EdgeRightFn=

[Vibration]
; the game's rumble (engine revs, collisions, tyres):
;   Auto   = HD haptics over USB (our waveforms on the controller's haptic actuators), rumble emulation over Bluetooth
;   Audio  = HD haptics only (USB)
;   Rumble = the controller's rumble emulation (USB and Bluetooth)
;   Off
; ("HD haptics (USB)" in Settings > Controls: Auto or Rumble)
Mode=Auto
; strength in percent (up to 200; "Vibration" in Settings > Controls)
Strength=100
; HD haptics: the tones of the heavy (left) and the light (right) motor, in Hz
HapticsLowHz=45
HapticsHighHz=160
; the car itself, from the game's own data: the engine as a hum at its revs (louder towards the redline and with
; the throttle), knocking on the rev limiter, a knock at each gear change (HD haptics; over Bluetooth the gear
; changes and the rev limiter only); percent, 0 = off ("Engine feel" in Settings > Controls)
Car=40
; the game's own rumble on crashes, in percent. The game shakes the pad at full for any touch of a fence or a bush;
; here it grows with the impact instead (a scrape: light, a pole or a wall at speed: full). 0 = no crash rumble
Collisions=60
; the menus felt, as on a PS5 (from the game's own interface sounds): a tick for every move, a click for every
; choice, a swell as a page opens, the tombola's drum ticking by as it slows down; percent, 0 = off
; ("Menu haptics" in Settings > Controls)
Menus=60
; the game's events felt: skills and their combo (near misses, drifts, air...), banked or lost, checkpoints,
; countdowns, speed traps, landings after a jump, level-ups and prizes; percent, 0 = off ("Game events")
Events=70
; the road under the wheels, from the game's own surfaces: gravel crunches, dirt and grass rumble softly, sand is
; grainy, cobbles knock, kerbs drum -- each on the side of the car it is under, and in the trigger you press;
; tarmac is quiet; percent, 0 = off ("Road surface" in Settings > Controls)
Surface=60

[Triggers]
; the adaptive triggers on (1) or off (0) ("Adaptive triggers" in Settings > Controls)
Enabled=1
; what they do:
;   Game           = they follow the car (from the game's own data on the tyres and the engine):
;                    past the front tyres' grip limit under braking L2 pulses like an ABS at work -- or, without
;                    ABS, a locked wheel makes the pedal go hard where it is (the mod tells by the brakes: a wheel
;                    locking means no ABS, three hard stops at the limit without one mean ABS); R2 vibrates with
;                    wheel spin and knocks on the rev limiter; a gear change knocks on the trigger you press; a crash
;                    or a landing jolts both, by how hard it was; the road's texture (gravel, dirt, a kerb...) is in
;                    the trigger you press; the resistance below the rest of the time
;   ResistanceOnly = only the resistance
;   Off
Mode=Game
; strength in percent ("Trigger strength" in Settings > Controls)
Strength=100
; L2: Slope = a brake pedal (light at first, harder at the end), Constant, Off
BrakeResistance=Slope
; where it starts (0 = at once .. 8) and its force at the start and at the end (1..8)
BrakeStart=1
BrakeForceStart=1
BrakeForceEnd=6
; R2: Constant, Slope, Off; start (0..9) and force (1..8)
ThrottleResistance=Constant
ThrottleStart=1
ThrottleForce=1
; how fast the triggers vibrate, in Hz
BrakeVibrationHz=30
ThrottleVibrationHz=40
; where the brake trigger starts to chatter: the front tyres' slip in percent of their grip limit (100 = at it,
; lower = a warning before it; it is full at 300, the wheels locked; the game's own Xbox One triggers: 150)
BrakeSlipStart=120
; where the throttle trigger starts with wheel spin (full at 250; the game's own: 70)
SpinSlipStart=80
; a knock on gear changes, knocking on the rev limiter, a jolt on crashes (1 on, 0 off)
GearChangeKick=1
RevLimiter=1
CrashJolt=1
; in the menus, with the game paused, loading: the triggers free (0 = the resistance stays)
FreeInMenus=1

[Lightbar]
; Rumble = the colour, flashing towards FlashColor with the vibration (impacts, tyres sliding)
; Revs   = the colour while cruising, turning red towards the redline, flashing on the rev limiter
; Static = the colour; Battery = green (full) to red (empty); Off
Mode=Rumble
Color=255, 70, 0
FlashColor=255, 255, 255
; percent ("Light bar" in Settings > Controls)
Brightness=100
; blink red when the battery is at 15% or less and not charging
LowBatteryBlink=1
; the five player lights as a rev counter while driving: from 70% of the redline, all five at it, flashing on the
; limiter (0 = player 1; "Rev counter lights" in Settings > Controls)
RevLights=1
; the skill combo on the player lights (over the rev counter): a light more for every skill in the chain, all five
; blinking when it is banked, the middle one when it is lost (1 on, 0 off; "Combo on the player lights")
ComboLights=1

[Icons]
; the game's button icons with the PlayStation pictures, the controls screen's drawing too (given to the game through
; Extra Options' mediaoverride as Azimuth starts):
;   Auto = when a DualSense is connected as Azimuth starts;  On = always;  Off = the game's own
; ("PlayStation button icons" in Settings > Controls: Auto or Off; from the next start of Azimuth)
; The pictures are inside d3d12.dll. Your own: a DualSense.icons (a zip of PNG pictures, the same names and
; sizes) in this folder is taken instead.
PlayStation=Auto

[Gyro]
; steering by tilting the controller like a wheel ("Gyro steering" in Settings > Controls: Toggle or Off):
;   Toggle = the mic button switches it on and off (the mic light is on while it is on; the position when you
;            switch it on is the centre)
;   On     = always (the centre: how you hold it when the controller connects)
;   Off    = the mic button does nothing
Steering=Toggle
; tilt for full lock, in degrees
MaxAngle=40
; 1 = steer the other way
Invert=0
